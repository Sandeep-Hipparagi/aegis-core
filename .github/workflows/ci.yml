name: AegisCore CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Invariant Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Environment & Tool Versions
        run: |
          node -v
          npm -v

      - name: Compile Distribution Bundles
        run: npm run build

      - name: Run Full Test Suite with Coverage
        run: npm run test:coverage

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Coverage
        run: pip install coverage

      - name: Run Python SDK Tests with Coverage Gate
        run: npm run test:python:coverage

      - name: Run Live Banking Invariant Demonstration
        run: npm run demo:banking

      - name: Verify CLI Executable
        run: |
          node --experimental-strip-types bin/aegis.ts --help
          node --experimental-strip-types bin/aegis.ts audit verify
          ! node --experimental-strip-types bin/aegis.ts audit verify --file non-existent.log

